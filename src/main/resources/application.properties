# Server port — Railway injects $PORT; falls back to 8089 locally
server.port=${PORT:8089}

# Application name
spring.application.name=High Low Jack

# Version — update this with each release so setup page shows the running version
app.version=v0.9.7
spring.devtools.livereload.port=35730

# ═══════════════════════════════════════════════════════════════════════════════
# HIGH LOW JACK - SPRING BOOT APPLICATION PROPERTIES
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# PostgreSQL Database Configuration
# ═══════════════════════════════════════════════════════════════════════════════

# Database — env vars override for Railway; local defaults for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/highlowjack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:highlowjack_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:b4nd1t}

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ═══════════════════════════════════════════════════════════════════════════════
# JPA / Hibernate Configuration
# ═══════════════════════════════════════════════════════════════════════════════

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ═══════════════════════════════════════════════════════════════════════════════
# Logging
# ═══════════════════════════════════════════════════════════════════════════════

logging.level.org.hibernate.SQL=${LOG_SQL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_SQL:WARN}
logging.level.com.dalegames.highlowjack=INFO

# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION - Railway PostgreSQL (use environment variables)
# ═══════════════════════════════════════════════════════════════════════════════

# Uncomment for Railway deployment:
# spring.datasource.url=${DATABASE_URL}
# spring.jpa.hibernate.ddl-auto=validate

# ═══════════════════════════════════════════════════════════════════════════════
# Session Configuration (keep existing session settings)
# ═══════════════════════════════════════════════════════════════════════════════

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

