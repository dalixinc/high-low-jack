<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Multiplayer Game - High Low Jack</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .join-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header .emoji {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        
        .error-message {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c00;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .form-group input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.2rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: border-color 0.3s;
        }
        
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .position-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .position-card {
            position: relative;
        }
        
        .position-card input[type="radio"] {
            display: none;
        }
        
        .position-label {
            display: block;
            padding: 20px;
            background: #f8f9fa;
            border: 3px solid #ddd;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .position-label:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .position-card input[type="radio"]:checked + .position-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
        }
        
        .position-card input[type="radio"]:disabled + .position-label {
            background: #e0e0e0;
            border-color: #ccc;
            color: #999;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .position-emoji {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        
        .position-name {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .position-taken {
            font-size: 0.8rem;
            margin-top: 5px;
            color: #c00;
        }
        
        .join-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .join-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .join-button:active {
            transform: translateY(0);
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="join-container">
        <div class="header">
            <div class="emoji">🎮</div>
            <h1>Join Multiplayer Game</h1>
        </div>
        
        <div th:if="${error}" class="error-message" th:text="${error}">
            Error message here
        </div>
        
        <div class="info-box">
            <strong>💡 How to join:</strong><br>
            Enter the 6-character code your friend shared, pick your seat, and get ready to play!
        </div>
        
        <form th:action="@{/highlowjack/multiplayer/join}" method="post">
            <div class="form-group">
                <label for="joinCode">🔢 Game Code</label>
                <input type="text" 
                       id="joinCode" 
                       name="joinCode" 
                       placeholder="ABC123" 
                       maxlength="6"
                       required
                       autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="playerName">👤 Your Name</label>
                <input type="text" 
                       id="playerName" 
                       name="playerName" 
                       placeholder="Enter your name" 
                       maxlength="20"
                       required
                       autocomplete="off"
                       style="text-transform: none; letter-spacing: normal;">
            </div>
            
            <div class="form-group">
                <label>🪑 Choose Your Seat</label>
                <div class="position-grid">
                    <div class="position-card">
                        <input type="radio" id="pos0" name="position" value="0" 
                               th:disabled="${mpGame != null and mpGame.isPositionTaken(0)}">
                        <label for="pos0" class="position-label">
                            <div class="position-emoji">⬆️</div>
                            <div class="position-name">North</div>
                            <div th:if="${mpGame != null and mpGame.isPositionTaken(0)}" 
                                 class="position-taken">✓ Taken</div>
                        </label>
                    </div>
                    
                    <div class="position-card">
                        <input type="radio" id="pos1" name="position" value="1"
                               th:disabled="${mpGame != null and mpGame.isPositionTaken(1)}">
                        <label for="pos1" class="position-label">
                            <div class="position-emoji">➡️</div>
                            <div class="position-name">East</div>
                            <div th:if="${mpGame != null and mpGame.isPositionTaken(1)}" 
                                 class="position-taken">✓ Taken</div>
                        </label>
                    </div>
                    
                    <div class="position-card">
                        <input type="radio" id="pos2" name="position" value="2"
                               th:disabled="${mpGame != null and mpGame.isPositionTaken(2)}">
                        <label for="pos2" class="position-label">
                            <div class="position-emoji">⬇️</div>
                            <div class="position-name">South</div>
                            <div th:if="${mpGame != null and mpGame.isPositionTaken(2)}" 
                                 class="position-taken">✓ Taken</div>
                        </label>
                    </div>
                    
                    <div class="position-card">
                        <input type="radio" id="pos3" name="position" value="3"
                               th:disabled="${mpGame != null and mpGame.isPositionTaken(3)}">
                        <label for="pos3" class="position-label">
                            <div class="position-emoji">⬅️</div>
                            <div class="position-name">West</div>
                            <div th:if="${mpGame != null and mpGame.isPositionTaken(3)}" 
                                 class="position-taken">✓ Taken</div>
                        </label>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="join-button">🚀 Join Game</button>
        </form>
        
        <a th:href="@{/highlowjack/setup}" class="back-link">← Back to Setup</a>
    </div>
    
    <script>
        // Auto-uppercase the join code
        document.getElementById('joinCode').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });
        
        // Auto-select first available position
        window.addEventListener('load', function() {
            const radios = document.querySelectorAll('input[type="radio"][name="position"]');
            for (let radio of radios) {
                if (!radio.disabled) {
                    radio.checked = true;
                    break;
                }
            }
        });
    </script>
</body>
</html>
